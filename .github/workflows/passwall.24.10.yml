#=================================================
# https://github.com/wukongdaily/RunFilesBuilder
# Description: Repack IPKs from SourceForge to .run installer
# Lisence: MIT
#=================================================

name: passwall 24.10

on:
  workflow_dispatch:
    inputs:
      # 更新为 24.10 的地址
      repo_url:
        description: 'SourceForge Repo URL'
        required: true
        default: 'https://sourceforge.net/projects/openwrt-passwall-build/files/releases/packages-24.10/aarch64_cortex-a53/'
      
      arch_name:
        description: 'Architecture Name (for filename)'
        required: true
        default: 'aarch64_cortex-a53'

jobs:
  repack:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get install -y wget unzip

      - name: Clone makeself
        run: git clone https://github.com/megastep/makeself.git

      - name: Download IPKs from SourceForge
        run: |
          # 1. 转换 URL 格式
          # 输入: https://sourceforge.net/projects/NAME/files/PATH/
          # 目标: https://downloads.sourceforge.net/project/NAME/PATH/
          
          INPUT_URL="${{ inputs.repo_url }}"
          # 移除末尾斜杠
          INPUT_URL=${INPUT_URL%/}
          
          # 提取关键部分：替换 'projects' 为 'project'，并移除 '/files'
          DOWNLOAD_BASE=$(echo "$INPUT_URL" | sed 's/sourceforge.net\/projects/downloads.sourceforge.net\/project/' | sed 's/\/files\//\//')
          
          echo "Base Download URL: $DOWNLOAD_BASE"
          
          mkdir -p package_root
          cd package_root
          
          # 2. 下载 Packages 索引文件
          echo "Downloading Packages list..."
          wget -q "${DOWNLOAD_BASE}/Packages.gz" -O Packages.gz
          gunzip Packages.gz
          
          # 3. 解析文件名并下载
          echo "Parsing and downloading IPKs..."
          # 从 Packages 文件中提取 Filename 字段
          grep "Filename:" Packages | awk '{print $2}' > filelist.txt
          
          count=0
          total=$(wc -l < filelist.txt)
          
          while read filename; do
            count=$((count+1))
            echo "[$count/$total] Downloading $filename..."
            # 使用 wget 下载，自动处理 SourceForge 的重定向
            wget -q "${DOWNLOAD_BASE}/${filename}"
          done < filelist.txt
          
          # 清理索引文件
          rm Packages filelist.txt
          
          echo "Download complete. Total files:"
          ls -1 | wc -l

      - name: Create Installation Script
        run: |
          cat << 'EOF' > package_root/install.sh
          #!/bin/sh
          echo "==============================================="
          echo "   Installing Passwall (SourceForge Repack)    "
          echo "==============================================="
          
          cd "$(dirname "$0")"
          
          echo "Installing packages..."
          # 强制安装所有 ipk
          # --force-depends: 忽略内核版本差异 (这在跨版本安装时很重要)
          # --force-overwrite: 覆盖系统中已有的文件
          opkg install *.ipk --force-depends --force-overwrite
          
          if [ $? -eq 0 ]; then
              echo "✅ Success! Please refresh LuCI."
              # rm -f *.ipk
          else
              echo "❌ Some errors occurred, but forcing installation."
          fi
          EOF
          
          chmod +x package_root/install.sh

      - name: Package into .run
        run: |
          VERSION=$(date +'%Y.%m.%d')
          ARCH="${{ inputs.arch_name }}"
          # 文件名标记为 24.10 以示区别
          FILENAME="Passwall_24.10_Repack_${ARCH}_${VERSION}.run"
          
          ./makeself/makeself.sh package_root/ $FILENAME "Passwall Installer ($ARCH)" ./install.sh
          
          echo "OUTPUT_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Repack-${{ env.OUTPUT_FILENAME }}
          name: Passwall 24.10 Repack ${{ env.OUTPUT_FILENAME }}
          files: ${{ env.OUTPUT_FILENAME }}
          body: |
            ### SourceForge 转包自动构建 (OpenWrt 24.10)
            
            **源地址：** ${{ inputs.repo_url }}
            **架构：** ${{ inputs.arch_name }}
            
            **包含组件：**
            Passwall 主程序及其所有依赖（Xray, Sing-box, Hysteria 等）。
            
            **安装方法：**
            上传到 `/tmp`，执行 `sh ${{ env.OUTPUT_FILENAME }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
